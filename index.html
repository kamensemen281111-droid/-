<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>
<style>
  :root{
    --bg:#0b0e14;
    --bg2:#0f1320;
    --fg:#c8d3f5;
    --dim:#5b6480;
    --green:#7ee787;
    --cyan:#7dcfff;
    --yellow:#e0af68;
    --magenta:#bb9af7;
    --red:#f7768e;
    --accent:#7aa2f7;
    --line:rgba(122,162,247,.14);
    --font:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(122,162,247,.10), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(187,154,247,.08), transparent 60%),
      var(--bg);
    color:var(--fg);
    font-family:var(--font);
    font-size:15px;
    line-height:1.65;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
  }

  .win{
    width:100%;
    max-width:920px;
    height:min(78vh,760px);
    background:linear-gradient(180deg,var(--bg2),var(--bg));
    border:1px solid var(--line);
    border-radius:12px;
    box-shadow:0 30px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.02) inset;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    backdrop-filter:blur(4px);
  }

  .bar{
    display:flex;
    align-items:center;
    gap:8px;
    padding:12px 14px;
    border-bottom:1px solid var(--line);
    background:rgba(255,255,255,.015);
    user-select:none;
  }
  .dot{width:12px;height:12px;border-radius:50%}
  .r{background:#ff5f57}.y{background:#febc2e}.g{background:#28c840}
  .bar .title{
    margin-left:10px;color:var(--dim);font-size:13px;letter-spacing:.3px;
  }
  .bar .right{margin-left:auto;color:var(--dim);font-size:12px}

  .screen{
    flex:1;
    overflow-y:auto;
    padding:18px 20px 8px;
    scrollbar-width:thin;
    scrollbar-color:rgba(122,162,247,.35) transparent;
  }
  .screen::-webkit-scrollbar{width:8px}
  .screen::-webkit-scrollbar-thumb{background:rgba(122,162,247,.28);border-radius:8px}

  .line{white-space:pre-wrap;word-break:break-word}
  .user{color:var(--green)}
  .path{color:var(--cyan)}
  .sym{color:var(--dim)}
  .muted{color:var(--dim)}
  .ok{color:var(--green)}
  .warn{color:var(--yellow)}
  .err{color:var(--red)}
  .accent{color:var(--accent)}
  .mag{color:var(--magenta)}
  .head{color:var(--cyan);font-weight:700}
  .k{color:var(--yellow)}
  a{color:var(--accent);text-decoration:none;border-bottom:1px dotted rgba(122,162,247,.5)}
  a:hover{color:#a9c2ff}

  .cmdline{display:flex;flex-wrap:wrap;align-items:baseline;gap:0}
  .cmdline .prompt{white-space:pre}

  #input{
    flex:1;
    min-width:120px;
    background:transparent;
    border:0;
    outline:0;
    color:var(--fg);
    font:inherit;
    caret-color:transparent;
    padding:0;
  }

  .caret{
    display:inline-block;
    width:9px;height:1.05em;
    background:var(--fg);
    vertical-align:-2px;
    animation:blink 1.05s steps(1) infinite;
    border-radius:1px;
  }
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

  .cursor-hidden .caret{display:none}
  .screen input[readonly]{pointer-events:none}

  .spin{
    display:inline-block;
    animation:spin .8s steps(8) infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .hint{margin-top:14px;color:var(--dim);font-size:13px}
  .hint b{color:var(--fg);font-weight:600}

  .block{padding:2px 0}
  .tag{
    display:inline-block;
    font-size:11px;
    padding:1px 7px;
    border:1px solid var(--line);
    border-radius:999px;
    color:var(--dim);
    margin-right:6px;
  }
  .ascii{color:var(--accent);font-weight:700}
</style>
</head>
<body>
  <div class="win" id="win">
    <div class="bar">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span class="title" id="wintitle">guest@portfolio — bash — 80×24</span>
      <span class="right" id="clock"></span>
    </div>
    <div class="screen" id="screen"></div>
  </div>

<script>
(function(){
  "use strict";

  var screen = document.getElementById('screen');
  var clock  = document.getElementById('clock');

  var state = {
    cwd: '~',
    busy: false,
    started: false
  };

  var history = [];
  var hIndex = 0;

  var CMD = {
    help:      'список доступных команд',
    about:     'кто я и чем занимаюсь',
    works:     'избранные проекты',
    skills:    'стек и навыки',
    contact:   'как со мной связаться',
    whoami:    'вывести текущего пользователя',
    ls:        'содержимое текущей директории',
    pwd:       'показать текущий путь',
    clear:     'очистить экран',
    theme:     'сменить акцентный цвет (theme green|cyan|magenta|yellow)',
    banner:    'показать логотип',
    sudo:      'выполнить от имени суперпользователя',
    date:      'текущая дата и время',
    echo:      'вывести строку на экран'
  };

  /* ---------- helpers ---------- */

  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function atBottom(){
    return screen.scrollHeight - screen.scrollTop - screen.clientHeight < 60;
  }

  function scrollDown(force){
    if(force || atBottom()) screen.scrollTop = screen.scrollHeight;
  }

  function el(html, cls){
    var d = document.createElement('div');
    d.className = 'line' + (cls ? ' ' + cls : '');
    d.innerHTML = html;
    screen.appendChild(d);
    scrollDown(false);
    return d;
  }

  function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

  function promptHTML(){
    return '<span class="user">guest@portfolio</span>'
         + '<span class="sym">:</span>'
         + '<span class="path">' + esc(state.cwd) + '</span>'
         + '<span class="sym">$</span> ';
  }

  /* ---------- typing effect ---------- */

  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function typeInto(node, text, speed){
    if(reduced){
      node.innerHTML = esc(text).replace(/\n/g,'<br>');
      scrollDown(false);
      return Promise.resolve();
    }
    return new Promise(function(resolve){
      var i = 0;
      (function step(){
        if(i >= text.length){
          node.innerHTML = esc(text).replace(/\n/g,'<br>');
          scrollDown(false);
          resolve();
          return;
        }
        var chunk = text.slice(i, i + (text[i] === '\n' ? 1 : 2));
        node.innerHTML = esc(text.slice(0, i + chunk.length)).replace(/\n/g,'<br>');
        i += chunk.length;
        scrollDown(false);
        setTimeout(step, speed + Math.random()*speed*0.6);
      })();
    });
  }

  function out(text, cls){
    el(esc(text).replace(/\n/g,'<br>'), cls);
  }

  async function typeOut(text, speed, cls){
    var node = el('', cls);
    await typeInto(node, text, speed);
    return node;
  }

  /* ---------- live input line ---------- */

  var input, caret;

  function makeInputLine(){
    var line = document.createElement('div');
    line.className = 'line cmdline';
    line.innerHTML = '<span class="prompt">' + promptHTML() + '</span>'
                   + '<input id="input" autocomplete="off" autocapitalize="off" '
                   + 'spellcheck="false" aria-label="command input">'
                   + '<span class="caret" id="caret"></span>';
    screen.appendChild(line);
    input = line.querySelector('#input');
    caret = line.querySelector('#caret');

    input.addEventListener('keydown', onKey);
    input.addEventListener('input', function(){ caret.style.display='inline-block'; });
    input.addEventListener('blur', function(){ caret.classList.add('cursor-hidden'); });
    input.addEventListener('focus', function(){ caret.classList.remove('cursor-hidden'); });

    input.focus({preventScroll:true});
    scrollDown(true);
  }

  function freeze(){
    if(!input) return;
    var value = input.value;
    var row = input.parentNode;
    input.remove();
    row.querySelector('.prompt').insertAdjacentHTML('afterend',
      '<span>' + esc(value) + '</span>');
    if(caret) caret.remove();
    input = null; caret = null;
    return value;
  }

  /* ---------- command handling ---------- */

  async function run(raw){
    var line = raw.trim();
    if(line === ''){ makeInputLine(); return; }

    history.push(line);
    hIndex = history.length;

    var clean = line.replace(/^\//, '');
    var parts = clean.split(/\s+/);
    var cmd = parts[0].toLowerCase();
    var args = parts.slice(1);

    state.busy = true;

    try{
      switch(cmd){
        case 'help':    await cmdHelp(); break;
        case 'about':   await cmdAbout(); break;
        case 'works':   await cmdWorks(); break;
        case 'skills':  await cmdSkills(); break;
        case 'contact': await cmdContact(); break;
        case 'banner':  await cmdBanner(); break;
        case 'ls':      await cmdLs(); break;
        case 'pwd':     out(state.cwd === '~' ? '/home/guest' : state.cwd, ''); break;
        case 'whoami':  out('guest', ''); break;
        case 'date':    out(new Date().toLocaleString('ru-RU'), ''); break;
        case 'echo':    out(args.join(' '), ''); break;
        case 'theme':   cmdTheme(args[0]); break;
        case 'sudo':    await cmdSudo(args); break;
        case 'clear':   screen.innerHTML = ''; break;
        case 'exit':    out('logout', 'muted'); break;
        default:
          out('команда не найдена: ' + esc(parts[0]), 'err');
          out('введите <span class="k">help</span> для списка команд.', 'muted');
      }
    } catch(e){
      out('ошибка выполнения: ' + esc(e.message), 'err');
    }

    state.busy = false;
    makeInputLine();
  }

  /* ---------- commands ---------- */

  async function cmdHelp(){
    out('доступные команды', 'head');
    out('', '');
    var rows = Object.keys(CMD).map(function(k){
      var pad = k + ' '.repeat(Math.max(1, 10 - k.length));
      return '  <span class="k">' + pad + "</span> <span class="muted">" + esc(CMD[k]) + '</span>';
    });
    el(rows.join('\n'));
    out('', '');
    out('подсказка: команды можно писать со слэшем — <span class="k">/about</span>, <span class="k">/works</span>.', 'muted');
  }

  async function cmdAbout(){
    out('', '');
    await typeOut('Привет. Я — разработчик интерфейсов и немного инженер.', 14, '');
    await typeOut('Делаю быстрые, аккуратные веб-продукты: от лендингов до', 14, '');
    await typeOut('внутренних инструментов и дашбордов.', 14, '');
    out('', '');
    out('Обычно работаю на стыке дизайна и кода: важно, чтобы', 'muted');
    out('интерфейс был не только красивым, но и понятным.', 'muted');
    out('', '');
  }

  async function cmdWorks(){
    out('избранные проекты', 'head');
    out('', '');
    var items = [
      ['01', 'Terminal Portfolio', 'этот самый сайт — интерфейс командной строки', 'vanilla JS'],
      ['02', 'Data Board',         'дашборд метрик с живыми графиками',           'React · D3'],
      ['03', 'Docs Engine',        'быстрый генератор документации',             'Node · TS'],
      ['04', 'Shop UI Kit',        'библиотека компонентов для e-commerce',      'CSS · TS']
    ];
    for(var i=0;i<items.length;i++){
      var it = items[i];
      el('<span class="accent">[' + it[0] + ']</span> <b>' + esc(it[1]) + '</b>');
      el('     <span class="muted">' + esc(it[2]) + '  ·  </span><span class="tag">' + esc(it[3]) + '</span>');
    }
    out('', '');
    out('подробности — по запросу <span class="k">contact</span>.', 'muted');
  }

  async function cmdSkills(){
    out('стек', 'head');
    out('', '');
    var groups = [
      ['frontend', 'HTML · CSS · JavaScript · TypeScript · React · Vue'],
      ['backend',  'Node.js · Express · Python · PostgreSQL'],
      ['tools',    'Git · Docker · Vite · Figma'],
      ['другое',   'немного дизайна, немного аналитики, много любопытства']
    ];
    for(var i=0;i<groups.length;i++){
      var g = groups[i];
      el('<span class="accent">' + esc(g[0]) + '</span>');
      el('  <span class="muted">' + esc(g[1]) + '</span>');
    }
    out('', '');
  }

  async function cmdContact(){
    out('связь', 'head');
    out('', '');
    el('  <span class="k">email</span>  <a href="kamensemen281111@gmail.com">kamensemen281111@gmail.com</a>');
    el('  <span class="k">github</span> <a href="https://github.com/kamensemen281111-droid" target="_blank" rel="noopener">github.com/username</a>');
    el('  <span class="k">tg</span>     <a href="https://t.me/" target="_blank" rel="noopener">@username</a>');
    out('', '');
    out('открыт к интересным задачам и сотрудничеству.', 'ok');
    out('', '');
  }

  async function cmdBanner(){
    var art = [
      '  ██████╗ ██╗   ██╗███████╗███████╗████████╗',
      ' ██╔════╝ ██║   ██║██╔════╝██╔════╝╚══██╔══╝',
      ' ██║  ███╗██║   ██║█████╗  ███████╗   ██║   ',
      ' ██║   ██║██║   ██║██╔══╝  ╚════██║   ██║   ',
      ' ╚██████╔╝╚██████╔╝███████╗███████║   ██║   ',
      '  ╚═════╝  ╚═════╝ ╚══════╝╚══════╝   ╚═╝   '
    ].join('\n');
    el('<span class="ascii">' + esc(art) + '</span>');
    out('', '');
    out('  <span class="muted">интерфейсы · код · данные</span>');
    out('', '');
  }

  async function cmdLs(){
    var entries = [
      ['about.txt', 'cyan'],
      ['works/',    'accent'],
      ['skills.md', 'cyan'],
      ['contact.txt','cyan'],
      ['notes/',    'accent']
    ];
    el(entries.map(function(e){
      return '<span class="' + e[1] + '">' + esc(e[0]) + '</span>';
    }).join('   '));
    out('', '');
  }

  function cmdTheme(name){
    var map = {
      green:  '#7ee787',
      cyan:   '#7dcfff',
      magenta:'#bb9af7',
      yellow: '#e0af68',
      blue:   '#7aa2f7'
    };
    if(!name || !map[name.toLowerCase()]){
      out('использование: <span class="k">theme green|cyan|magenta|yellow|blue</span>', 'warn');
      return;
    }
    var c = map[name.toLowerCase()];
    document.documentElement.style.setProperty('--accent', c);
    out('акцентный цвет изменён → ' + name.toLowerCase(), 'ok');
  }

  async function cmdSudo(args){
    out('guest не входит в список sudoers. Об этом инциденте сообщено.', 'err');
    out('', '');
    await typeOut('...шутка. Но доступ всё равно не дам :)', 16, 'muted');
    out('', '');
  }

  /* ---------- key handling ---------- */

  function onKey(e){
    if(!input) return;

    if(e.key === 'Enter'){
      e.preventDefault();
      var v = freeze();
      run(v);
      return;
    }

    if(e.key === 'ArrowUp'){
      e.preventDefault();
      if(hIndex > 0){
        hIndex--;
        input.value = history[hIndex] || '';
      }
      return;
    }
    if(e.key === 'ArrowDown'){
      e.preventDefault();
      if(hIndex < history.length - 1){
        hIndex++;
        input.value = history[hIndex] || '';
      } else {
        hIndex = history.length;
        input.value = '';
      }
      return;
    }

    if(e.key === 'Tab'){
      e.preventDefault();
      var cur = input.value.trim().replace(/^\//,'').toLowerCase();
      if(!cur) return;
      var keys = Object.keys(CMD);
      var match = keys.filter(function(k){ return k.indexOf(cur) === 0; });
      if(match.length === 1){
        input.value = match[0];
      } else if(match.length > 1){
        out('', '');
        el('<span class="muted">' + match.join('   ') + '</span>');
      }
      return;
    }

    if(e.key === 'l' && e.ctrlKey){
      e.preventDefault();
      screen.innerHTML = '';
      return;
    }
  }

  document.getElementById('win').addEventListener('mousedown', function(e){
    if(window.getSelection && String(window.getSelection()).length > 0) return;
    if(input) setTimeout(function(){ input.focus({preventScroll:true}); }, 0);
  });

  function tick(){
    var d = new Date();
    clock.textContent = d.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
  }
  tick(); setInterval(tick, 15000);

  async function boot(){
    if(state.started) return;
    state.started = true;

    await cmdBanner();

    var bootLines = [
      'guest@portfolio:~$ ./start.sh',
      '  загрузка профиля ................ ok',
      '  монтирование /works ............. ok',
      '  подключение к skills.db ......... ok'
    ];
    for(var i=0;i<bootLines.length;i++){
      await typeOut(bootLines[i], 10, '');
    }
    out('', '');
    out('Добро пожаловать. Введите help, чтобы увидеть команды,', 'muted');
    out('или сразу about, works, contact.', 'muted');
    out('', '');

    makeInputLine();
  }

  boot();

})();
</script>
</body>
</html>
